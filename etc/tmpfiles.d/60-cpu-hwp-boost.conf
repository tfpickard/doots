# Enable intel_pstate HWP dynamic boost at every boot.
#
# HWP dynamic boost lets the CPU ramp idle cores up to turbo faster when a
# bursty/interactive task lands on them, improving responsiveness without
# changing the governor. This is a system (root) sysfs knob, so it lives here
# rather than in the symlinked $HOME dotfiles.
#
# Install:
#   sudo cp ~/doots/etc/tmpfiles.d/60-cpu-hwp-boost.conf /etc/tmpfiles.d/
#   sudo systemd-tmpfiles --create /etc/tmpfiles.d/60-cpu-hwp-boost.conf
#
# Type 'w' writes the argument (1) to the file each boot.
w /sys/devices/system/cpu/intel_pstate/hwp_dynamic_boost - - - - 1
