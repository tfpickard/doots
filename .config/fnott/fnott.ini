# fnott -- minimal, keyboard-driven notification daemon for wlroots.
#
# The lightest of the three daemons here: no GTK, no control centre, renders
# directly with freetype/pixman. Use it when you want notifications to be
# invisible infrastructure rather than a feature.
#
# Only ONE process can own org.freedesktop.Notifications, so this is mutually
# exclusive with mako and swaync:
#
#     ~/.config/scripts/notify-daemon.sh fnott
#     ~/.config/scripts/notify-daemon.sh mako     # back to the default
#
# Format is unix ini: an unnamed global section first, then per-urgency
# sections [low] / [normal] / [critical] that override it. Every option below
# was checked against fnott.ini(5) for this version (1.4.1) -- note there is
# NO border-radius option, so these notifications are square-cornered unlike
# the mako/swaync ones.
#
# Colours are RGBA -- 8 hex digits, not 6. The "THEME:" markers let
# ~/.config/themes/theme-set rewrite them; don't remove them.

# --- Placement -------------------------------------------------------------
# Top-right, clear of waybar (8px top margin + 34px bar height).
anchor=top-right
edge-margin-vertical=50
edge-margin-horizontal=12
notification-margin=8

# Oldest/highest-priority nearest the anchor, so a new notification pushes
# down rather than shoving the stack around.
stacking-order=top-down

# Draw above fullscreen windows. Set to "top" to let fullscreen video cover
# them instead.
layer=overlay

# Leave `output` unset and the compositor chooses, so notifications follow the
# active screen. Pin it to always use the laptop panel:
# output=eDP-1

# --- Geometry --------------------------------------------------------------
min-width=360
max-width=460
max-height=300
padding-vertical=12
padding-horizontal=14
border-size=1

# --- Icons -----------------------------------------------------------------
max-icon-size=48
icon-theme=Papirus-Dark

# --- Timeouts (seconds) ----------------------------------------------------
# max-timeout caps whatever an app requests, so one badly behaved program
# can't pin a notification on screen indefinitely.
default-timeout=8
max-timeout=30

# Hold notifications back while the session is idle, so you don't return to a
# wall of stale popups. 0 disables.
idle-timeout=0

# --- Fonts and text --------------------------------------------------------
title-font=JetBrainsMono Nerd Font:size=10
summary-font=JetBrainsMono Nerd Font:size=11:weight=bold
body-font=JetBrainsMono Nerd Font:size=10

# Placeholders: %a app name, %s summary, %b body, %c category, %h hint.
title-format=<i>%a</i>
summary-format=<b>%s</b>
body-format=%b

# --- Default colours -------------------------------------------------------
# THEME:fnott-bg
background=16181aee
# THEME:fnott-border
border-color=1e2124ff
# THEME:fnott-title
title-color=b3bccbff
# THEME:fnott-summary
summary-color=ffffffff
# THEME:fnott-body
body-color=b3bccbff
# THEME:fnott-progress
progress-bar-color=bd5effff
progress-bar-height=3

# --- Per-urgency overrides -------------------------------------------------

[low]
# Dimmer and quicker: background chatter you don't need to read.
# THEME:fnott-low-bg
background=16181acc
# THEME:fnott-border
border-color=1e2124ff
# THEME:fnott-low-summary
summary-color=b3bccbff
# THEME:fnott-low-body
body-color=7b8496ff
default-timeout=4

[normal]
# THEME:fnott-bg
background=16181aee
# THEME:fnott-border
border-color=1e2124ff
default-timeout=8

[critical]
# Coloured border and no timeout -- the whole point of the urgency level is
# that it waits for you.
# THEME:fnott-crit-bg
background=16181af5
# THEME:fnott-crit-border
border-color=ff6e5eff
# THEME:fnott-crit-summary
summary-color=ff6e5eff
# THEME:fnott-crit-body
body-color=ffffffff
default-timeout=0

# Audible alert for critical notifications. sound-file is substituted into
# play-sound, which defaults to `aplay ${filename}`.
# sound-file=/usr/share/sounds/freedesktop/stereo/dialog-warning.oga
