# Tracked because gtk-3.0 previously had no settings.ini at all: waybar and
# swaync are both GTK3, so without this they got no dark preference, no icon
# theme, no font, and no cursor theme -- purely default Adwaita-light on an
# otherwise all-dark desktop.
#
# No gtk.css here, deliberately: the @define-color palette in
# themes/active/gtk.css is a GTK4/libadwaita mechanism (named colors like
# accent_color, window_bg_color) that GTK3 doesn't understand. GTK3 gets its
# theming from gtk-theme-name below instead, which is a complete, real theme
# rather than a handful of color variables.
[Settings]
gtk-application-prefer-dark-theme=1
gtk-theme-name=Adwaita-dark
gtk-font-name=JetBrainsMono Nerd Font 11
gtk-icon-theme-name=Yaru-dark
gtk-cursor-theme-name=dmz-white-4bit
gtk-cursor-theme-size=32
gtk-hint-font-metrics=1
