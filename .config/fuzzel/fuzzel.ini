# fuzzel — launcher. Colors are NOT set here; they come from the active global
# theme via the include below, which `theme-set` repoints by flipping the
# themes/active symlink.
[main]
# fuzzel's include= requires an absolute path -- NOT one relative to this
# file. A relative path here parses but fails at runtime with "not an
# absolute path", which is how the previous version of this file sat broken
# and undeployed (it wasn't in Makefile's CONFIG_DIRS, so nothing ever
# actually loaded it to notice).
include=~/.config/themes/active/fuzzel.ini
font=JetBrainsMono Nerd Font:size=12
dpi-aware=no
prompt= 
# Papirus-Dark isn't installed on this machine -- icon-theme silently falls
# through to nothing if you set a theme fuzzel can't find. Yaru is, and is
# what's actually been rendering.
icon-theme=Yaru
icons-enabled=yes
terminal=ghostty -e
layer=overlay
lines=12
width=42
horizontal-pad=22
vertical-pad=16
inner-pad=10
# fzf-style matching: fuzzy fragments match like fzf does, not just prefixes.
match-mode=fzf

[border]
width=2
radius=16

[key-bindings]
# emacs-flavored navigation in addition to the arrow keys
prev=Up Control+p
next=Down Control+n
