# macOS-only Ghostty settings.
# Loaded via `config-file = ?os/active` in the main config, when the per-machine
# `os/active` symlink points here (created by `make ghostty`, which picks
# macos.conf vs linux.conf from `uname`).

# Quick terminal, summoned from anywhere with Cmd+Enter. The `global:` prefix
# needs macOS Accessibility permission (System Settings > Privacy & Security >
# Accessibility). This is the macOS-only feature that warns/no-ops on Linux,
# which is why it lives here instead of the shared config.
keybind = global:super+enter=toggle_quick_terminal

# vim: ft=config
