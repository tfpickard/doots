# Linux-only Ghostty settings.
# Loaded via `config-file = ?os/active` in the main config, when the per-machine
# `os/active` symlink points here (created by `make ghostty`, which picks
# macos.conf vs linux.conf from `uname`).

# Linux desktops without an XDG GlobalShortcuts portal (e.g. XFCE, wlroots/Sway)
# can't honor `global:` keybinds, so the macOS Cmd+Enter summon warns and no-ops.
# As an equivalent, bind a NON-global toggle that works while Ghostty is focused.
# Note: your window manager may itself grab Super+Enter; if so, change this key.
keybind = super+enter=toggle_quick_terminal

# vim: ft=config
