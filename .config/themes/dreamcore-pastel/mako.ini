# Dreamcore Pastel — mako notification daemon config (symlinked to ~/.config/mako/config)
font=JetBrainsMono Nerd Font 11
background-color=#1b1a26ee
text-color=#e6e2f1
border-color=#c9a7ff
progress-color=over #2a2839
border-size=2
border-radius=12
padding=12
margin=8
default-timeout=6000
max-visible=5
layer=overlay
anchor=top-right

[urgency=critical]
border-color=#ff9db0
default-timeout=0

[mode=do-not-disturb]
invisible=1
