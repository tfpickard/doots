# Dreamcore Pastel — mako notification daemon config (symlinked to ~/.config/mako/config)
font=JetBrainsMono Nerd Font 11
background-color=#1b1a26ee
text-color=#e6e2f1
border-color=#c9a7ff
progress-color=over #2a2839
border-size=2
border-radius=12
padding=12
margin=8
default-timeout=6000
max-visible=5
layer=overlay
anchor=top-right

# Group notifications from the same app (Teams/Slack chat spam collapses
# into one growing stack instead of five separate popups). Middle-click
# dismisses a whole group at once -- mako has no default binding there.
group-by=app-name
on-button-middle=dismiss-group

# Deliberately no per-app (app-name=...) rules for Teams/Slack/Outlook yet:
# a PWA's notification app-name is whatever the page sets via the Notification
# API, not necessarily "Microsoft Teams" -- guessing it wrong would silently
# never match, which is worse than no rule at all. Check `makoctl history`
# after a real notification from each to get the actual value, then add
# [app-name="..."] sections here.

# Low-urgency notifications (most desktop-entry hints, some background app
# chatter) get a shorter timeout and a dimmer border than normal, so they
# read as less demanding of attention without disappearing instantly.
[urgency=low]
border-color=#6f6b86
default-timeout=3000

[urgency=critical]
border-color=#ff9db0
default-timeout=0

[mode=do-not-disturb]
invisible=1
