# dreamcore-pastel — tmux colors (sourced via ~/.config/themes/active/tmux.conf, switched by theme-set)
set -g status-style "bg=#1b1a26,fg=#e6e2f1"
set -g pane-border-style "fg=#2a2839"
set -g pane-active-border-style "fg=#a7f0e0"
set -g message-style "bg=#a7f0e0,fg=#1b1a26"
set -g message-command-style "bg=#b6f0c2,fg=#1b1a26"
setw -g window-status-style "fg=#b0aac6,bg=#14131d"
setw -g window-status-current-style "bg=#c9a7ff,fg=#1b1a26,bold"
setw -g window-status-activity-style "bg=#ffe6a7,fg=#1b1a26"
setw -g mode-style "bg=#a7f0e0,fg=#1b1a26"
set -g clock-mode-colour "#a7f0e0"
set -g status-left "#{prefix_highlight} #[fg=#b6f0c2,bg=#2a2839,bold] #S #[default]"
