# cyberdream — tmux colors (sourced via ~/.config/themes/active/tmux.conf, switched by theme-set)
set -g status-style "bg=#16181a,fg=#ffffff"
set -g pane-border-style "fg=#1e2124"
set -g pane-active-border-style "fg=#5ef1ff"
set -g message-style "bg=#5ef1ff,fg=#16181a"
set -g message-command-style "bg=#5eff6c,fg=#16181a"
setw -g window-status-style "fg=#b3bccb,bg=#0f1113"
setw -g window-status-current-style "bg=#bd5eff,fg=#16181a,bold"
setw -g window-status-activity-style "bg=#f1ff5e,fg=#16181a"
setw -g mode-style "bg=#5ef1ff,fg=#16181a"
set -g clock-mode-colour "#5ef1ff"
set -g status-left "#{prefix_highlight} #[fg=#5eff6c,bg=#1e2124,bold] #S #[default]"
