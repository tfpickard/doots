# Cyberdream — mako notification daemon config (symlinked to ~/.config/mako/config)
font=JetBrainsMono Nerd Font 11
background-color=#16181aee
text-color=#ffffff
border-color=#bd5eff
progress-color=over #1e2124
border-size=2
border-radius=12
padding=12
margin=8
default-timeout=6000
max-visible=5
layer=overlay
anchor=top-right

[urgency=critical]
border-color=#ff6e5e
default-timeout=0

[mode=do-not-disturb]
invisible=1
