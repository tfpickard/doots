# Catppuccin Mocha — mako notification daemon config
font=JetBrainsMono Nerd Font 11
background-color=#1e1e2eee
text-color=#cdd6f4
border-color=#cba6f7
progress-color=over #313244
border-size=2
border-radius=12
padding=12
margin=8
default-timeout=6000
max-visible=5
layer=overlay
anchor=top-right

[urgency=critical]
border-color=#f38ba8
default-timeout=0

[mode=do-not-disturb]
invisible=1
