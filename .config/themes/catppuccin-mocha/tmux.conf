# catppuccin-mocha — tmux colors (sourced via ~/.config/themes/active/tmux.conf, switched by theme-set)
set -g status-style "bg=#1e1e2e,fg=#cdd6f4"
set -g pane-border-style "fg=#313244"
set -g pane-active-border-style "fg=#b4befe"
set -g message-style "bg=#b4befe,fg=#1e1e2e"
set -g message-command-style "bg=#a6e3a1,fg=#1e1e2e"
setw -g window-status-style "fg=#a6adc8,bg=#181825"
setw -g window-status-current-style "bg=#cba6f7,fg=#1e1e2e,bold"
setw -g window-status-activity-style "bg=#f9e2af,fg=#1e1e2e"
setw -g mode-style "bg=#b4befe,fg=#1e1e2e"
set -g clock-mode-colour "#b4befe"
set -g status-left "#{prefix_highlight} #[fg=#a6e3a1,bg=#313244,bold] #S #[default]"
