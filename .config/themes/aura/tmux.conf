# aura — tmux colors (sourced via ~/.config/themes/active/tmux.conf, switched by theme-set)
set -g status-style "bg=#15141b,fg=#edecee"
set -g pane-border-style "fg=#29263c"
set -g pane-active-border-style "fg=#61ffca"
set -g message-style "bg=#61ffca,fg=#15141b"
set -g message-command-style "bg=#61ffca,fg=#15141b"
setw -g window-status-style "fg=#bdbdbd,bg=#110f18"
setw -g window-status-current-style "bg=#a277ff,fg=#15141b,bold"
setw -g window-status-activity-style "bg=#ffca85,fg=#15141b"
setw -g mode-style "bg=#61ffca,fg=#15141b"
set -g clock-mode-colour "#61ffca"
set -g status-left "#{prefix_highlight} #[fg=#61ffca,bg=#29263c,bold] #S #[default]"
