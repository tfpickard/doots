# Aura — mako notification daemon config (symlinked to ~/.config/mako/config)
font=JetBrainsMono Nerd Font 11
background-color=#15141bee
text-color=#edecee
border-color=#a277ff
progress-color=over #29263c
border-size=2
border-radius=12
padding=12
margin=8
default-timeout=6000
max-visible=5
layer=overlay
anchor=top-right

[urgency=critical]
border-color=#ff6767
default-timeout=0

[mode=do-not-disturb]
invisible=1
