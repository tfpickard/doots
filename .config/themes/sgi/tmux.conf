# sgi — tmux colors (sourced via ~/.config/themes/active/tmux.conf, switched by theme-set)
set -g status-style "bg=#1c3a6b,fg=#ffffff"
set -g pane-border-style "fg=#29558e"
set -g pane-active-border-style "fg=#ffffff"
set -g message-style "bg=#ffffff,fg=#1c3a6b"
set -g message-command-style "bg=#66c98a,fg=#1c3a6b"
setw -g window-status-style "fg=#c8d8ef,bg=#14294d"
setw -g window-status-current-style "bg=#8fc0ff,fg=#1c3a6b,bold"
setw -g window-status-activity-style "bg=#f0cd6b,fg=#1c3a6b"
setw -g mode-style "bg=#ffffff,fg=#1c3a6b"
set -g clock-mode-colour "#ffffff"
set -g status-left "#{prefix_highlight} #[fg=#66c98a,bg=#29558e,bold] #S #[default]"
