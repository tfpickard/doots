# SGI — mako notification daemon config (symlinked to ~/.config/mako/config)
font=JetBrainsMono Nerd Font 11
background-color=#1c3a6bee
text-color=#ffffff
border-color=#8fc0ff
progress-color=over #29558e
border-size=2
border-radius=12
padding=12
margin=8
default-timeout=6000
max-visible=5
layer=overlay
anchor=top-right

[urgency=critical]
border-color=#e8706b
default-timeout=0

[mode=do-not-disturb]
invisible=1
