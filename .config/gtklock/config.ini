# gtklock -- GTK-based lock screen for wlroots compositors.
#
# An ALTERNATIVE to swaylock, not a replacement: swaylock is still what
# swayidle runs. gtklock's draw is that it's a real GTK app, so the lock screen
# can be styled with CSS and extended with modules (media controls, user
# avatar, power buttons).
#
# Try it:   gtklock            (Ctrl+C or authenticate to get out)
# Use it:   swap `swaylock -f` for `gtklock -d` in the swayidle line in
#           ~/.config/niri/config.kdl
#
# Format is glib key file: every option under [main], and each one is also a
# command-line flag (`gtklock --idle-timeout=30`). Options verified against
# `gtklock --help-config` for 2.1.0.
#
# IMPORTANT -- niri needs `-i` / `--no-input-inhibit`:
# gtklock 2.1.0 tries to grab input with wlr-input-inhibitor, a protocol niri
# does not implement (it uses the newer ext-session-lock instead). Without the
# flag gtklock aborts with
#     CRITICAL: Your compositor doesn't support wlr-input-inhibitor
# So always launch it as:
#     gtklock -i
# and in the swayidle line as `gtklock -d -i`.

[main]

# CSS styling for the lock window -- see style.css next to this file.
# NOTE: gtklock does NOT expand "~", so this must be an absolute path. A
# relative or ~-prefixed path fails with "Failed to import: Error opening
# file .../~/.config/..." and you silently get an unstyled lock screen.
style=/home/tom/.config/gtklock/style.css

# Follow the GTK theme the rest of the desktop uses.
gtk-theme=Adwaita-dark

# Clock format, strftime(3) syntax (see date(1)).
time-format=%H:%M  ·  %A %e %B

# Hide the password form after this many seconds idle, leaving just the clock
# and background. Any keypress brings it back. This is what makes gtklock feel
# like a screensaver rather than a password prompt.
idle-hide=true
idle-timeout=15

# Start with the form already hidden, so the lock shows the clock first.
start-hidden=true

# Background: deliberately NOT set here.
#
# gtklock(1) notes that CSS overrides --background, and CSS is also the only
# way to control scaling, so the Silicon Graphics backdrop is set by the
# `window` rule in style.css instead. lock.sh regenerates the image at the
# size of the largest connected output and rewrites the tagged url() line
# before launching. Set SGI_LOCK=0 to skip that and fall back to the flat
# background-color.
#
# Note the backdrop is drawn by the lock itself -- it does NOT show your actual
# desktop (no compositor lets a lock screen do that).
# background=/home/tom/Pictures/Wallpaper/default

# Modules extend the lock form. They're separate .so files in /usr/lib/gtklock/
# and are NOT packaged for Ubuntu 24.04 -- nothing is installed here, so these
# stay commented. Build from https://github.com/jovanlanik if you want them:
#   playerctl-module  media controls on the lock screen
#   userinfo-module   avatar + username
#   powerbar-module   suspend / reboot / poweroff buttons
# modules=playerctl-module;userinfo-module;powerbar-module

# Commands run around the lock. Useful to pause music when you walk away and
# resume when you come back.
# lock-command=playerctl pause
# unlock-command=playerctl play
