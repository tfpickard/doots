# Tracked so a re-image doesn't regenerate this by hand.
#
# The cursor lines matter more than they look: this used to be an untracked
# file that pinned Yaru@24 while niri/config.kdl and .icons/default/index.theme
# both pin dmz-white-4bit@32. Three places is one too many for "the cursor
# theme" to live -- this file existing at all was the actual bug (see
# AGENTS.md's cursor-theme section). Keep all three in agreement.
#
# gtk-theme-name is mostly inert for libadwaita apps (they read
# gtk-application-prefer-dark-theme plus our gtk.css @define-color overrides,
# symlinked from themes/active/gtk.css), but non-libadwaita GTK4 clients still
# consult it, so it's set for completeness.
[Settings]
gtk-application-prefer-dark-theme=1
gtk-theme-name=Adwaita-dark
gtk-font-name=JetBrainsMono Nerd Font 11
gtk-icon-theme-name=Yaru-dark
gtk-cursor-theme-name=dmz-white-4bit
gtk-cursor-theme-size=32
gtk-hint-font-metrics=1
